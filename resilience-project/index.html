<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resilience Project Visualizations</title>
  <style>
    :root { color-scheme: light; --ink: #17211d; --muted: #617069; --line: #d9e1dc; --paper: #f6f8f6; --surface: #fff; --accent: #176b55; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    header { padding: 24px clamp(18px, 4vw, 56px) 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; max-width: 1440px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(30px, 4vw, 48px); font-weight: 500; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .back-link, .open-link { color: var(--accent); text-decoration: none; font-weight: 650; }
    .back-link { flex: 0 0 auto; }
    nav { display: flex; gap: 8px; max-width: 1440px; margin: 18px auto 0; overflow-x: auto; padding-bottom: 2px; }
    button { min-height: 40px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--surface); font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button[aria-selected="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
    main { max-width: 1440px; margin: 0 auto; padding: 18px clamp(12px, 3vw, 40px) 32px; }
    .viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    #view-title { font-weight: 700; }
    iframe { display: block; width: 100%; height: calc(100vh - 230px); min-height: 620px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    @media (max-width: 720px) { .title-row { align-items: flex-start; flex-direction: column; gap: 12px; } iframe { height: 75vh; min-height: 520px; } }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div>
        <h1>Resilience Project</h1>
        <p>Interactive topic-modeling visualizations for climate adaptation and urban resilience solutions.</p>
      </div>
      <a class="back-link" href="../">Back to portfolio</a>
    </div>
    <nav aria-label="Visualization selector">
      <button type="button" data-src="lda_dashboard.html" data-title="Regional topic dashboard" aria-selected="true">Regional dashboard</button>
      <button type="button" data-src="lda_visualization.html" data-title="LDA topic map" aria-selected="false">Topic map</button>
      <button type="button" data-src="lda_visualization_english.html" data-title="English-language topic map" aria-selected="false">English topics</button>
      <button type="button" data-src="lda_visualization_clouds.html" data-title="Topic clouds" aria-selected="false">Topic clouds</button>
      <button type="button" data-src="lda_visualization_with_filtered_bigram_wordclouds.html" data-title="Filtered bigram word clouds" aria-selected="false">Bigrams</button>
      <button type="button" data-src="lda_visualization_with_filtered_noun_bigram_wordclouds.html" data-title="Filtered noun-bigram word clouds" aria-selected="false">Noun bigrams</button>
      <button type="button" data-src="lda_visualization_with_filtered_noun_noun_bigram_wordclouds.html" data-title="Filtered noun-noun word clouds" aria-selected="false">Noun-noun bigrams</button>
      <button type="button" data-src="topic_overview.html" data-title="Combined topic overview" aria-selected="false">Full overview</button>
      <button type="button" data-src="documentation.html" data-title="Method and code documentation" aria-selected="false">Documentation</button>
    </nav>
  </header>
  <main>
    <div class="viewer-bar">
      <span id="view-title">Regional topic dashboard</span>
      <a id="open-view" class="open-link" href="lda_dashboard.html" target="_blank" rel="noopener">Open full screen</a>
    </div>
    <iframe id="viewer" src="lda_dashboard.html" title="Regional topic dashboard"></iframe>
  </main>
  <script>
    const buttons = document.querySelectorAll("nav button");
    const viewer = document.querySelector("#viewer");
    const title = document.querySelector("#view-title");
    const openView = document.querySelector("#open-view");
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((item) => item.setAttribute("aria-selected", "false"));
        button.setAttribute("aria-selected", "true");
        viewer.src = button.dataset.src;
        viewer.title = button.dataset.title;
        title.textContent = button.dataset.title;
        openView.href = button.dataset.src;
      });
    });
  </script>
</body>
</html>
